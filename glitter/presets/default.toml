# The reference preset: the only one documented in full. Copy this file to
# start your own — every knob is explained where it appears.
#
# About `harmonics`: the bucket count is (distinct harmonics across all
# systems) * phase_slots. A new system that reuses harmonic numbers already in
# play adds no buckets at all and is therefore free.

frames = 48       # cycle length; at fps = 20 that is 2.4 seconds
fps = 20
phase_slots = 4   # buckets = len(distinct harmonics) * phase_slots
seed = 0

# Travelling sweeps. `passes` is passes per cycle and must be an integer —
# a fractional value tears the loop.
#
# Keep `width` narrow. A gaussian profile has long tails, and on wide bands
# they add up into a constant wash across the whole frame: the median of the
# field drifts up to 0.34, glitter is lifted by half again everywhere, and the
# card simply washes out instead of having a beam travel over it. Aim for a
# field median near zero with a peak of 1.5 to 2.
sweep_base_gain = 0.30     # how much a sweep lifts the picture itself
# How much harder a sweep lifts the glitter beneath it. This is the main source
# of blinding overexposure: at 1.40 glitter under the beam was multiplied by
# 2.4, and ablating one system at a time showed sweeps contributing more to
# clipping than anything else (+4.2 percentage points, against +3.7 for the
# medium dots and +0.9 for the stars).
sweep_glitter_gain = 1.05

# A speck is dimmed by the brightness of where it lands: white cannot be made
# whiter. Without this, on smooth bright pictures glitter is the only
# high-frequency detail left and it erases the structure. 0 disables it.
headroom = 0.7

[[sweep]]      # the main wave
angle = 35
bands = 2
passes = 1
width = 0.06
strength = 1.0

[[sweep]]      # counter-running, more frequent and narrower
angle = -20
bands = 4
passes = 2
width = 0.045
strength = 0.55

[[sweep]]      # near-horizontal, slow
angle = 78
bands = 1
passes = 1
width = 0.07
strength = 0.40

# Shimmering outline around the glittered regions — the trick from period
# tutorials (`Selections > Expand` by a pixel, "it looks best when you have a
# border"). Disabled here: `default` goes for a soft scatter. To see it switched
# on, look at the y2k preset.
#
#   strength  — outline brightness; 0 disables the whole section
#   threshold — density-map cutoff: what counts as a glittered region
#   width     — a RADIUS: the outline extends `width` pixels outward from the
#               border and the same distance inward, so the ring is twice that
#               thick. Specified for an 800px frame side and scaled from there,
#               so that --preview matches the full render
#   harmonics — as for particle systems, integers only. Outline pixels are
#               scattered across buckets one at a time, so the outline shimmers
#               rather than pulsing as one piece. Cannot be empty if strength > 0
[contour]
strength = 0.0
threshold = 0.55
width = 1
harmonics = [1, 2]
colors = ["#ffffff"]

# Colour pulsing: these are amplitudes, not absolute values. The phases of the
# three parameters are spread a third of a period apart internally — in
# lockstep they read as one shared brightness pulse.
[grade]
saturation = 0.16
contrast = 0.09
hue = 5.0        # degrees
harmonic = 1     # integer, or the loop tears

# One flash per cycle. Gentle by default: a 1.35x brightness lift, no white.
# The full-frame white strobe lives behind `white` and the --flash-extreme
# flag — it both reads as a bug and is dangerous for photosensitive viewers.
[flash]
strength = 0.35
frames = 3
at = 0.5
white = 0.0

# Feature weights for the density map. Tune them with --dump-density.
[density]
luma = 0.30        # brighter areas sparkle more
luma_gamma = 2.0   # >1 sharpens the contrast: only the genuinely bright
saturation = 0.20
edges = 0.20       # glitter gathers along contours
text = 0.22        # white lettering outlines shine, but stay readable
protect_skin = 0.9 # faces and hands are left nearly alone
floor = 0.03       # the background still sparkles, just faintly

[[density.hue_band]]  # roses
center = 330
width = 35
weight = 0.55

[[density.hue_band]]  # gold
center = 48
width = 22
weight = 0.40

[system.fine]
count = 20000
sprite = "dot"
size_range = [3, 5]
gain = 0.8
density_gamma = 1.3   # fine dust is drawn to the bright spots
harmonics = [3, 4, 5]
colors = ["#ffffff", "#fff2b0", "#ffd6f5", "#d9f4ff"]

[system.medium]
count = 4000
sprite = "dot"
size_range = [7, 11]
gain = 0.85
density_gamma = 0.6   # larger dots spread out and stay off thin letter strokes
harmonics = [1, 2]
colors = ["#ffffff", "#ffe27a", "#ff9ee0"]

[system.stars]
count = 900
sprite = "star4"
size_range = [15, 27]
gain = 0.85
density_gamma = 2.0   # stars land only where the picture is genuinely bright
harmonics = [1, 2]
colors = ["#ffffff", "#fff6c9", "#ffd9f2"]

[system.star6]
count = 260
sprite = "star6"
size_range = [19, 31]
gain = 0.8
density_gamma = 2.2
harmonics = [2, 3]
colors = ["#ffffff", "#fff2b0"]

[system.bigstars]
count = 110
sprite = "star8"
size_range = [31, 45]
gain = 0.8
density_gamma = 2.6   # the largest ones sit at the brightness peak and nowhere else
harmonics = [1]
colors = ["#ffffff", "#fff6c9"]
